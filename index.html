<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaLane Mall Parking · Pay Station</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #d9dde5; --accent: #2457d6; --ok: #127a3e; --warn: #b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --card: #1a1f27; --ink: #e8ebf1; --muted: #98a2b3; --line: #2d3440; --accent: #7da2ff; --ok: #4ade80; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); margin-top: 0; padding: 8px 10px; }
  .fee { font-size: 32px; font-weight: 700; margin: 8px 0; }
  .open { color: var(--ok); } .pay { color: var(--warn); }
  pre { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; font-size: 13px; white-space: pre-wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>MegaLane Mall Parking · Pay Station</h1>
  <p class="sub">Exit gate simulator. Open <a href="tests.html">tests.html</a> to see the tests.</p>

  <div class="grid">
    <section>
      <label for="ticket">Ticket</label>
      <input id="ticket" value="T-1001">
      <label for="entry">Entry time (Bangkok)</label>
      <input id="entry" type="datetime-local" value="2026-10-31T10:00">
      <label for="exit">Exit time (Bangkok)</label>
      <input id="exit" type="datetime-local" value="2026-10-31T13:20">
      <label><input id="lost" type="checkbox" style="width:auto"> Lost ticket</label>

      <label>Receipts scanned (amount as printed, in baht)</label>
      <div id="receipts"></div>
      <button class="ghost" id="add" type="button">+ Add receipt</button>
      <br>
      <button id="calc" type="button">Scan out</button>
    </section>

    <section>
      <div>Fee</div>
      <div class="fee" id="fee">–</div>
      <div id="barrier"></div>
      <label>Receipt</label>
      <pre id="paper">–</pre>
    </section>
  </div>
</main>

<script>window.Parking = {};</script>
<script src="src/money.js"></script>
<script src="src/time.js"></script>
<script src="src/pricing.js"></script>
<script src="src/stamps.js"></script>
<script src="src/gate.js"></script>
<script src="src/receipt.js"></script>
<script>
  const { processExit, formatReceipt, formatBaht } = window.Parking;
  const $ = (id) => document.getElementById(id);
  const toIso = (local) => local + ':00+07:00';

  function addReceiptRow(amountText = '1250.00', type = 'shop') {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<input class="amount" value="' + amountText + '">' +
      '<select class="type"><option value="shop">shop</option><option value="cinema">cinema</option></select>' +
      '<button class="ghost remove" type="button">×</button>';
    row.querySelector('.type').value = type;
    row.querySelector('.remove').onclick = () => row.remove();
    $('receipts').appendChild(row);
  }

  function scanOut() {
    const exitAt = toIso($('exit').value);
    const lostTicket = $('lost').checked;
    const ticket = { id: $('ticket').value, entryAt: lostTicket ? null : toIso($('entry').value) };
    const scannedReceipts = [...document.querySelectorAll('#receipts .row')].map((row) => ({
      type: row.querySelector('.type').value,
      amountText: row.querySelector('.amount').value,
      issuedAt: exitAt,
    }));

    const result = processExit({ ticket, scannedReceipts, exitAt, lostTicket });
    $('fee').textContent = formatBaht(result.fee);
    $('barrier').innerHTML = result.barrier === 'open'
      ? '<strong class="open">Barrier opens</strong>'
      : '<strong class="pay">Pay first, then the barrier opens</strong>';
    $('paper').textContent = lostTicket
      ? 'Lost ticket: flat fee ' + formatBaht(result.fee)
      : formatReceipt({ ticketId: ticket.id, entryAt: ticket.entryAt, exitAt, freeHours: result.freeHours, fee: result.fee });
  }

  $('add').onclick = () => addReceiptRow();
  $('calc').onclick = scanOut;
  addReceiptRow();
  scanOut();
</script>
</body>
</html>
